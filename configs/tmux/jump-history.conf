# Visits are kept per attached client, in tmux memory, including the current pane.
set -g @jump-history-limit 9

# Native repeat timer, shared with other repeatable tmux keys (for example arrows).
set -g repeat-time 2000
# Read the live client state so timeout/Escape clears the indicator immediately.
# Plain prefix waiting also lights it; inactive state takes no space.
set -g @jump-history-waiting '#{?client_prefix,#[fg=colour46]#[bold]…#[nobold],}'

# tmux 3.7b requires a modifier in CSI-u (27;1u); VS Code/Kitty sends the
# valid short form 27u for plain Escape. Consume the whole sequence so its
# trailing text cannot leak into a pane. User900 is reserved for this shim.
set -s user-keys[900] "\033[27u"
bind -T root User900 send-keys Escape
bind -r -T prefix User900 switch-client -T root

# Ctrl-[ needs the extended keyboard setup in tmux.conf to differ from Escape.
# Leave plain [ / ] as copy / paste. Escape only cancels prefix/repeat waiting.
bind -r -T prefix C-[ run-shell 'python3 ~/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} back #{q:client_name}'
bind -r -T prefix Escape switch-client -T root
bind -r -T prefix C-] run-shell 'python3 ~/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} forward #{q:client_name}'

# Observe what clients actually see, not selections in hidden background windows.
# Background hooks can wait on the history lock without blocking tmux commands.
set-hook -g client-attached[20]        'run-shell -b "python3 ~/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} record"'
set-hook -g client-detached[20]        'run-shell -b "python3 ~/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} record"'
set-hook -g client-session-changed[20] 'run-shell -b "python3 ~/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} record"'
set-hook -g session-window-changed[20] 'run-shell -b "python3 ~/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} record"'
set-hook -g window-pane-changed[20]    'run-shell -b "python3 ~/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} record"'

# Seed clients already attached when this configuration is loaded.
run-shell -b 'python3 ~/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} record'
