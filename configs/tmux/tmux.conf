# Making tmux compatible with solarized/tokyonight colo schema
# 如果不设置这个数值， 那么颜色会看不清
set -g default-terminal "screen-256color"
# stop tmux rename window  every time a cmd executed
set-option -g allow-rename off
# Keep the outer terminal title, such as iTerm2's title bar, in sync with the
# same compact AI label used by the AI summary line. The title helper includes
# the first AI window from the sorted list instead of filtering out the current
# window like the status summary does.
set-option -g set-titles on
set-option -g set-titles-string "#{?@terminal_title,#{@terminal_title},#W}"
set-option -g history-limit 10000
set-window-option -g mode-keys vi

# Distinguish Ctrl-[ from Escape on modern xterm-compatible terminals.
# xterm uses modifyOtherKeys; VS Code uses Kitty's disambiguation mode.
# Set Kitty flags instead of pushing them, since tmux may enable keys repeatedly.
set -s extended-keys on
set -as terminal-features ',xterm-256color:extkeys'
set -as terminal-overrides ',xterm-256color:Eneks=\E[>4;2m\E[=1u:Dseks=\E[=0u\E[>4m'

# Work around old Gruvbox themes omitting fill in their message styles, which
# leaves status-bar text behind prompts on tmux 3.7+. Themes that set fill
# correctly do not need this override. Derive fill from the theme at draw time.
if-shell -F '#{>=:#{version},3.7}' "set -g message-format '#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#[#{?#{command_prompt},#{s/bg=/fill=/:message-command-style},#{s/bg=/fill=/:message-style}}]#{message}'"

bind -N '同步输入到本窗口所有 pane（开/关）' -T prefix S set-window-option synchronize-panes

# Bounded pane visit history, including jumps across sessions.
source-file ~/deploy/configs/tmux/jump-history.conf

# 下面的几个涉及window选择的功能都要注意如下问题
# - If -s is omitted and a marked pane is present (see select-pane -m), the marked pane is used rather than the current pane.


# prefix + j: join menu -- rearrange panes between windows and between split
# and floating.
#   v / h  move the current pane into the window of the previously visited pane
#          in another window (jump history, the same "previous" as prefix t p /
#          C-[), for both same- and cross-session; see join_previous.sh.
#          Vertical/horizontal name the divider line, as in Vim's :vsplit.
#   s / S  sink the current floating pane into this window as a side-by-side /
#          stacked split (float_to_split.sh; the process keeps running)
#   f      turn the current tiled Claude pane into a floating pane
#          (split_to_float.sh). tmux 3.7b cannot make an existing pane
#          floating, so it resumes the Claude session in a new floating pane
#          and kills the old one; refused while the pane is running.
# Menu commands are format-expanded when an item is picked.
bind -N '菜单：合并 pane / 移到别的 session / 浮窗↔分屏' -T prefix j display-menu -T "#[align=centre] 合并 / 浮窗 " -x C -y C -- \
  "-合并到上一个窗口（当前 pane 移过去）" "" "" \
  "(v)ertical    左右并排（竖分割线）"   v "run-shell \"$HOME/deploy/configs/tmux/script/join_previous.sh #{q:socket_path} #{q:client_name} #{pane_id} side-by-side\"" \
  "(h)orizontal  上下排列（横分割线）"   h "run-shell \"$HOME/deploy/configs/tmux/script/join_previous.sh #{q:socket_path} #{q:client_name} #{pane_id} stacked\"" \
  "" \
  "-当前 pane 作为新窗口移到别的 session（排在最后）" "" "" \
  "(n)ew window  移到上一个 session"     n "run-shell \"$HOME/deploy/configs/tmux/script/pane_to_session.sh #{q:client_name} #{pane_id} last\"" \
  "(N)ew window  用 fzf 选 session"      N "run-shell \"$HOME/deploy/configs/tmux/script/open_float_pane.sh --skip-jump-history --size 60x16 '#{pane_id}' $HOME/deploy/configs/tmux/script/pane_to_session.sh #{q:client_name} #{pane_id} pick\"" \
  "" \
  "-当前窗口：浮窗 ↔ 分屏" "" "" \
  "(s)plit  浮窗 → 左右分屏"           s "run-shell \"$HOME/deploy/configs/tmux/script/float_to_split.sh '#{pane_id}' side-by-side\"" \
  "(S)plit  浮窗 → 上下分屏"           S "run-shell \"$HOME/deploy/configs/tmux/script/float_to_split.sh '#{pane_id}' stacked\"" \
  "(f)loat  分屏 → 浮窗（Claude，resume 接回）" f "run-shell \"$HOME/deploy/configs/tmux/script/split_to_float.sh '#{pane_id}'\""
# - 这个配合 prefix ! 拆散 pane一起用会比较好
# 还有的问题
# - 从一个多个 pane的window join 到另外一个单个pane的window， 这导致我必须先 ! 一下才能join

# 同session swap
bind -N 'tmuxf：全屏选窗口并交换' -T prefix P display-popup -E -w 100% -h 100% "tmuxf"
bind -N '与上一个窗口交换位置' -T prefix W swap-window -t ':!'
# - 这个配合一个程序多个终端会比较好用

# 有时候跨session会出现换乱的情况，这时候到目标地址， 按 ^b ^f pane join 就可以准确地把他 merge回来

# 我想要的是  last window's last pane
# - 后面发现原来是需要用完整的格式
# BUG
# - 如果swap的时候不小心 按到了切换session的按键(比如 prefix w , prefix s)， 那么有可能切换到last sesion


bind -N '重启当前 pane（原目录重开）' -T prefix K respawn-pane -k -c "#{pane_current_path}" # kill tmux-pane and respawn it
# prefix + k: jump menu -- every "go somewhere" in one place, one key per item.
# `k` inside is the code session, so prefix k k is the old prefix k. Labels
# spell out what each key stands for, e.g. (t)oast. Items with a direct key
# show it in [brackets]; the window-opening items have none -- their
# old keys (C-n, C-c, O, C-v, C-r) were freed for this menu. Menu commands are
# format-expanded when an item is picked (so #{pane_id} etc. are the current
# pane); the session chooser's own -F format is kept for it by writing ##{...}
# (styles #[...] pass through as is).
bind -N '菜单：跳转' -T prefix k display-menu -T "#[align=centre] 跳转 " -x C -y C \
  "code session  — k 沿用原 prefix k"           k "switch-client -t code" \
  "(n)ews  learn session"                       n "run-shell -b '$HOME/deploy/helper_scripts/bin/N'" \
  "(d)iary  learn session"                      d "run-shell -b '$HOME/deploy/helper_scripts/bin/D'" \
  "(c)laude/codex 临时窗口  learn session"      c "run-shell '$HOME/deploy/helper_scripts/bin/c'" \
  "(o)rchestrator"                              o "run-shell '$HOME/deploy/configs/tmux/ai/orchestrator.sh -q'" \
  "(v)im 窗口"                                  v "run-shell \"$HOME/deploy/configs/tmux/script/ensure_vim_window.sh '#{session_name}' '#{pane_current_path}'\"" \
  "(r)anger 文件管理"                           r "run-shell \"$HOME/deploy/configs/tmux/script/ensure_ranger_fm.sh '#{session_name}' '#{pane_current_path}'\"" \
  "" \
  "(t)oast  上次完成弹框的 pane  [M-n]"         t "run-shell '$HOME/deploy/configs/tmux/script/switch_to_last_done_toast.sh'" \
  "(l)ast  最近活跃的 AI 窗口"                  l "run-shell '$HOME/deploy/configs/tmux/ai/switch_to_last_ai_window.sh -q'" \
  "(p)ending  当前 pane 在等的窗口"             p "run-shell \"$HOME/deploy/configs/tmux/script/jump_to_pending_target.sh #{q:client_name} '#{pane_id}'\"" \
  "(g)lobal  选择 AI 窗口, 所有 session  [C-g]" g "run-shell '$HOME/deploy/configs/tmux/ai/tmuxg.sh -A -q'" \
  "" \
  "(a)uto-switch  下一个  [a]"                  a "run-shell -b \"$HOME/deploy/configs/tmux/auto-switch/switch-next.sh --skip-pane '#{pane_id}'\"" \
  "(G) 序列版 g  在 auto-switch 序列中选择  [G]" G "run-shell '$HOME/deploy/configs/tmux/ai/tmuxg.sh --auto-switch-list -q'" \
  "" \
  "(s)ession  选择 session  [s]"                s "choose-session -Z -O name -F \"##{?session_attached,#[fg=green],#[fg=yellow]}##{window_name}#[default] | #[fg=magenta]##{pane_current_command}#[default]\"" \
  "← 历史后退  [C-[]"                           [ "run-shell 'python3 $HOME/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} back #{q:client_name}'" \
  "→ 历史前进  [C-]]"                           ] "run-shell 'python3 $HOME/deploy/configs/tmux/script/jump_history.py --socket #{q:socket_path} forward #{q:client_name}'"

# Detach other clients attached to the current session.
bind -N '踢掉连在本 session 的其它客户端' -T prefix C-d attach-session -d -t ''

# bind -T prefix s : choose a session from a list, but order by name (fixed and working)
# #{session_name}
bind -N '选择 session（按名字排序）' -T prefix s choose-session -Z -O name -F "#{?session_attached,#[fg=green],#[fg=yellow]}#{window_name}#[default] | #[fg=magenta]#{pane_current_command}#[default]"  # show session name, window name and current pane's command with colors

# https://unix.stackexchange.com/a/118381
# this will not work in low tmux version
bind -N '上下分屏（沿用当前目录）' '"' split-window -c "#{pane_current_path}"
bind -N '左右分屏（沿用当前目录）' % split-window -h -c "#{pane_current_path}"
bind -N '新窗口（沿用当前目录）' c new-window -c "#{pane_current_path}"

# prefix + H: a menu of every custom prefix key; press one there to run it.
bind -N '帮助：列出所有自定义快捷键' -T prefix H run-shell "$HOME/deploy/configs/tmux/script/help_menu.py #{q:client_name}"

# prefix + M-8: 70%-main vertical mirrored layout with the largest pane index as main.
bind -N '布局：编号最大的 pane 占 70% 主区' -T prefix M-8 run-shell "$HOME/deploy/configs/tmux/script/max_index_main_vertical_mirrored.py '#{pane_id}'"

# bind prefix + g to switch to or create an AI window (gemini or codex)
bind -N '切到或新建本 session 的 AI 窗口' -T prefix g run-shell "cd '#{pane_current_path}' && ~/deploy/configs/tmux/ai/tmuxg.sh --create-if-missing -q"

# prefix + C-q: create a quick-question remote AI window and prepend it to the auto-switch list
bind -N '新开 quick-question 远程 AI 窗口' -T prefix C-q run-shell -b "$HOME/deploy/configs/tmux/script/quick_question.sh '#{session_name}' '#{pane_current_path}'"

# Hide sessions matching any whitespace-separated Bash regex from tmuxg all-session pickers.
set -g @tmuxg-session-blacklist-regex '^ia_intern($|_)'

# prefix + a: switch to the next ranked auto-switch candidate outside current pane
bind -N '切到 auto-switch 序列里下一个可用 pane' -T prefix a run-shell -b "$HOME/deploy/configs/tmux/auto-switch/switch-next.sh --skip-pane '#{pane_id}'"

# prefix + A: toggle continuous auto-switch mode
bind -N '开关自动切换循环' -T prefix A run-shell -b "$HOME/deploy/configs/tmux/auto-switch/mode-loop.sh toggle"

# prefix + C-a: edit the auto-switch sequence in vim.
# A floating pane, not display-popup, so Esc works (see open_float_pane.sh);
# failures stay visible there too. It is kept out of the prefix+C-[ history.
bind -N '编辑 auto-switch 序列' -T prefix C-a run-shell "$HOME/deploy/configs/tmux/script/open_float_pane.sh --skip-jump-history '#{pane_id}' $HOME/deploy/configs/tmux/auto-switch/sequence.sh edit '#{pane_id}'"

# prefix + M-a: prepend the current pane (AI or ordinary) to the auto-switch sequence
bind -N '当前 pane 加到 auto-switch 序列首位' -T prefix M-a run-shell "$HOME/deploy/configs/tmux/auto-switch/sequence.sh prepend-current '#{pane_id}'"

# prefix + M-n: switch to the pane shown by the most recent task-done toast.
# Replaces the default next-window -a.
bind -N '跳到最近一次完成提示的 pane' -T prefix M-n run-shell "$HOME/deploy/configs/tmux/script/switch_to_last_done_toast.sh"

# prefix + t: capture-request menu -- typing "请capture…pane[X]的内容" into a
# pane (never presses Enter), in two directions:
#   send  this pane's request -> an AI pane (a: this session's, g: any session;
#         sends directly when there is exactly one, otherwise fzf)
#   pull  another pane's request -> this pane: p the previously visited pane
#         (back/forward jumps count, old prefix C-l); s / S any pane of this /
#         every session; i / I an AI pane of this / every session. s S i I pick
#         in a floating pane (pull_pane_target.sh); i I use the AI picker of
#         prefix C-g, with its status column.
# Lowercase is this session, uppercase every session. Items starting with "-"
# are the disabled group headers. Menu commands are format-expanded when an item
# is picked.
bind -N '菜单：capture 请求 / 完成提示' -T prefix t display-menu -T "#[align=centre] capture 请求 / 完成提示 " -x C -y C -- \
  "-完成提示（toast）"                          "" "" \
  "  (r)eplay  再显示一次上次的完成提示"        r "run-shell \"$HOME/deploy/configs/tmux/script/replay_done_toast.sh '#{pane_id}'\"" \
  "  (n)       跳到上次提示的 pane  [M-n]"      n "run-shell '$HOME/deploy/configs/tmux/script/switch_to_last_done_toast.sh'" \
  "" \
  "-发送：这个 pane → AI"                       "" "" \
  "  (a)i      本 session 的 AI"                a "run-shell \"$HOME/deploy/configs/tmux/ai/send_current_target_to_ai.sh -q\"" \
  "  (g)lobal  选一个 AI，所有 session"         g "run-shell \"$HOME/deploy/configs/tmux/ai/send_current_target_to_ai.sh -A -q\"" \
  "" \
  "-拉入：别的 pane → 这个 pane"                "" "" \
  "  (p)revious  上一个 pane"                   p "run-shell \"$HOME/deploy/configs/tmux/script/insert_previous_target.sh #{q:socket_path} #{q:client_name} #{q:pane_id}\"" \
  "  (s)ession   本 session 的 pane"            s "run-shell \"$HOME/deploy/configs/tmux/script/open_float_pane.sh '#{pane_id}' $HOME/deploy/configs/tmux/script/pull_pane_target.sh session '#{pane_id}'\"" \
  "  (S)         所有 session 的 pane"          S "run-shell \"$HOME/deploy/configs/tmux/script/open_float_pane.sh '#{pane_id}' $HOME/deploy/configs/tmux/script/pull_pane_target.sh all '#{pane_id}'\"" \
  "  a(i)        本 session 的 AI"              i "run-shell \"$HOME/deploy/configs/tmux/script/open_float_pane.sh '#{pane_id}' $HOME/deploy/configs/tmux/script/pull_pane_target.sh session-ai '#{pane_id}'\"" \
  "  (I)         所有 session 的 AI"            I "run-shell \"$HOME/deploy/configs/tmux/script/open_float_pane.sh '#{pane_id}' $HOME/deploy/configs/tmux/script/pull_pane_target.sh all-ai '#{pane_id}'\""

# prefix + v: Vim menu. c opens the current pane content in a scratch buffer of
# the Vim window; f / s open the capture in a new nvim (floating pane / split of
# this window) that closes with :q.
bind -N '菜单：Vim' -T prefix v display-menu -T "#[align=centre] Vim " -x C -y C \
  "(v)im 窗口  — 同 prefix k v"                  v "run-shell \"$HOME/deploy/configs/tmux/script/ensure_vim_window.sh '#{session_name}' '#{pane_current_path}'\"" \
  "(c)apture 当前 pane → Vim 窗口"              c "run-shell \"$HOME/deploy/configs/tmux/script/open_captured_pane_in_vim.sh '#{session_name}' '#{pane_id}' '#{pane_current_path}'\"" \
  "(f)loat  capture → 浮窗里新开 Vim"            f "run-shell \"$HOME/deploy/configs/tmux/script/open_captured_pane_in_vim.sh --float '#{session_name}' '#{pane_id}' '#{pane_current_path}'\"" \
  "(s)plit  capture → 分屏新开 Vim"              s "run-shell \"$HOME/deploy/configs/tmux/script/open_captured_pane_in_vim.sh --split '#{session_name}' '#{pane_id}' '#{pane_current_path}'\""

# prefix + M-c: in current session, always create a new AI window
bind -N '本 session 新开一个 AI 窗口' -T prefix M-c run-shell "~/deploy/configs/tmux/ai/tmuxg.sh --force-new -q"

# prefix + C-o: copy the latest completed Codex/Claude response into msg.md at
# the vault root (~/vaults/livesync-headless): a menu picks replace (the first row,
# so Enter keeps the old overwrite) or append.
bind -N '菜单：复制最近一条 AI 回复到 learn' -T prefix C-o display-menu -T "#[align=centre] 复制 AI 回复到 learn/msg.md " -x C -y C -- \
  "(r)eplace  覆盖 msg.md（默认）" r "run-shell -b \"$HOME/deploy/configs/tmux/ai/copy_last_message_to_learn.sh '#{pane_id}' replace\"" \
  "(a)ppend   追加到末尾"          a "run-shell -b \"$HOME/deploy/configs/tmux/ai/copy_last_message_to_learn.sh '#{pane_id}' append\""

# Keep tmux's default reverse pane rotation on prefix + M-o.

# set -g @ai_agent_stale_seconds 5

# Keep a simple @last_visit timestamp for pane-level AI sorting. Hooks run
# after switching, so this stamps the pane being viewed now.
set-hook -g after-select-pane[0]       'run-shell -b "~/deploy/configs/tmux/script/update_last_visit.sh \"#{pane_id}\""'
set-hook -g after-select-pane[10]      'run-shell -b "~/deploy/configs/tmux/script/pane_focus_70.sh apply \"#{pane_id}\""'
set-hook -g session-window-changed[0]  'run-shell -b "~/deploy/configs/tmux/script/update_last_visit.sh \"#{pane_id}\""'
set-hook -g session-window-changed[10] 'run-shell -b "~/deploy/configs/tmux/script/pane_focus_70.sh apply \"#{pane_id}\""'
set-hook -g client-session-changed[0]  'run-shell -b "~/deploy/configs/tmux/script/update_last_visit.sh \"#{pane_id}\""'
set-hook -g client-session-changed[10] 'run-shell -b "~/deploy/configs/tmux/script/pane_focus_70.sh apply \"#{pane_id}\""'
set-hook -g client-detached[0]         'run-shell -b "~/deploy/configs/tmux/script/update_last_visit.sh \"#{pane_id}\""'
set-hook -g after-split-window[10]     'run-shell -b "~/deploy/configs/tmux/script/pane_focus_70.sh apply \"#{pane_id}\""'
set-hook -g client-resized[10]         'run-shell -b "~/deploy/configs/tmux/script/pane_focus_70.sh apply \"#{pane_id}\""'
set-hook -g client-resized[90]         'run-shell -b "~/deploy/configs/tmux/script/refresh_status_lines.sh \"#{session_name}\""'
set-hook -g client-attached[90]        'run-shell -b "~/deploy/configs/tmux/script/refresh_status_lines.sh \"#{session_name}\""'
set-hook -g client-session-changed[90] 'run-shell -b "~/deploy/configs/tmux/script/refresh_status_lines.sh \"#{session_name}\""'
set-hook -g session-window-changed[90] 'run-shell -b "~/deploy/configs/tmux/script/refresh_status_lines.sh \"#{session_name}\""'
set-hook -g after-new-window[90]       'run-shell -b "~/deploy/configs/tmux/script/refresh_status_lines.sh \"#{session_name}\""'
# Not -b: mark_tma_window.sh needs the asking `tmux new-window` client still
# waiting, to see whether an agent made the window.
set-hook -g after-new-window[91]       'run-shell "~/deploy/configs/tmux/script/mark_tma_window.sh \"#{window_id}\""'
set-hook -g after-rename-window[90]    'run-shell -b "~/deploy/configs/tmux/script/refresh_status_lines.sh \"#{session_name}\""'
set-hook -g window-unlinked[90]        'run-shell -b "~/deploy/configs/tmux/script/refresh_status_lines.sh \"#{session_name}\""'
# The next-target green marker skips the pane you are on, so moving between panes
# in one window (which fires none of the [90] refresh hooks above) must recompute
# it. Only refresh-next-pane + a redraw are needed, not the full status rebuild.
set-hook -g after-select-pane[91]      'run-shell -b "~/deploy/configs/tmux/auto-switch/refresh-next-pane.sh; tmux refresh-client -S"'
set-hook -g after-kill-pane[90]        'run-shell -b "~/deploy/configs/tmux/ai/set_window_switcher_pane.sh cleanup"'
set-hook -g window-unlinked[91]        'run-shell -b "~/deploy/configs/tmux/ai/set_window_switcher_pane.sh cleanup"'
set-hook -g session-closed[90]         'run-shell -b "~/deploy/configs/tmux/ai/set_window_switcher_pane.sh cleanup"'

# Known issue: desktop clients deliver MouseDown1Status ranges here, but some
# mobile terminal clients do not make status clicks observable. If mobile clicks
# stop working, log mouse_status_range, mouse_x, and client_termname here first.
bind-key -T root MouseDown1Status if -F '#{||:#{m:sb_*,#{mouse_status_range}},#{||:#{m:aip_*,#{mouse_status_range}},#{||:#{m:aiw_*,#{mouse_status_range}},#{m:right,#{mouse_status_range}}}}}' 'run-shell -b "$HOME/deploy/configs/tmux/script/handle_status_button.sh \"#{mouse_status_range}\" \"#{session_name}\" \"#{pane_current_path}\" \"#{pane_id}\" \"#{client_last_session}\""' 'switch-client -t ='

# prefix + C-g: switch to an existing AI window across all sessions
bind -N '选择 AI 窗口（所有 session）' -T prefix c-g run-shell "~/deploy/configs/tmux/ai/tmuxg.sh -A -q"

# prefix + M-f: fork menu -- every way of forking the current AI session.
# `f` inside is the old prefix M-f, so prefix M-f f keeps it; the old prefix
# C-s is `j`.
#   f  fork into a new background window
#   j  fork, then join the forked pane back into the previous window; wrapper
#      rename is disabled so the joined pane cannot restore its temporary
#      window name on exit
bind -N '菜单：fork AI 会话' -T prefix M-f display-menu -T "#[align=centre] fork AI " -x C -y C \
  "(f)ork 到新的后台窗口  — f 沿用原 prefix M-f"        f "run-shell \"$HOME/deploy/configs/tmux/ai/fork_ai_session.sh -q --target '#{pane_id}'\"" \
  "(j)oin back  fork 后并回上一个窗口"                   j "run-shell \"$HOME/deploy/configs/tmux/ai/fork_ai_session.sh -q --target '#{pane_id}' --disable-tmux-rename --join-back\""

# prefix + C-m / Enter: toggle a floating pane with the session's tasks/CURRENT-<session>.md (what each TMA Agent is doing now) in nvim.
# Many terminals encode C-m as Enter, so keep both bindings for this action.
# (Replaced the former marked-pane jump; switch_to_marked_or_switcher_pane.sh is still available unbound.)
bind -N '浮窗打开本 session 的 tasks/CURRENT-<session>.md' -T prefix C-m run-shell "$HOME/deploy/configs/tmux/script/open_current_tasks.sh '#{session_name}' '#{window_id}' '#{pane_id}' '#{pane_current_path}'"
bind -N '浮窗打开本 session 的 tasks/CURRENT-<session>.md' -T prefix Enter run-shell "$HOME/deploy/configs/tmux/script/open_current_tasks.sh '#{session_name}' '#{window_id}' '#{pane_id}' '#{pane_current_path}'"

# prefix + C-u: mark the current AI pane as unread
bind -N '当前 AI pane 标为未读' -T prefix C-u run-shell "AI_AGENT_STATE_SOURCE=tmux-key:C-u ~/deploy/configs/tmux/script/track_ai_agent_state.sh unread \"#{pane_id}\""

# prefix + u: update the current pane's status. The title shows what is set.
#   u  mark unread (as prefix C-u)
#   m  toggle "muted": never marked unread, never toasts
#   d  toggle "done" (as prefix M-p d)
#   a  toggle the window's @tma_created ("made by an agent"), for a window the
#      hook got wrong or that changed hands
#   r / i  force the pane to running / idle, when its state is stale
bind -N '菜单：更新当前 pane 状态（running / idle / 未读 / 静音 / 完成 / Agent 窗口）' -T prefix u display-menu -T "#[align=centre] 状态#{?#{==:#{@ai_agent_running},1}, ● running,}#{?#{==:#{@ai_agent_background},1}, ◒ background,}#{?@ai_agent_unread, ◉ 未读,}#{?@ai_agent_muted, 🔇 已静音,}#{?@ai_agent_done, ✓ 已完成,}#{?@tma_created, [agent],} " -x C -y C -- \
  "(r)unning 设为 running（状态不对时手动纠正）" r "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:u-r ~/deploy/configs/tmux/script/track_ai_agent_state.sh running '#{pane_id}'\"" \
  "(i)dle    设为 idle"                  i "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:u-i ~/deploy/configs/tmux/script/track_ai_agent_state.sh idle '#{pane_id}'\"" \
  "" \
  "(u)nread  标为未读  [C-u]"           u "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:u-u ~/deploy/configs/tmux/script/track_ai_agent_state.sh unread '#{pane_id}'\"" \
  "(m)ute    静音 / 取消静音"           m "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:u-m ~/deploy/configs/tmux/script/track_ai_agent_state.sh toggle-mute '#{pane_id}'\"" \
  "(d)one    标记 / 取消完成"           d "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:u-d ~/deploy/configs/tmux/script/track_ai_agent_state.sh toggle-done '#{pane_id}'\"" \
  "(a)gent   标为 / 取消 Agent 开的窗口" a "if-shell -F '#{@tma_created}' 'set-option -wu @tma_created' 'set-option -w @tma_created 1' ; refresh-client -S"

# prefix + M-p: Pending menu for the current pane; the title shows its reason
# and whether it is marked done. Idle is not done: a long task goes idle many
# times on the way, so waiting for either is a separate item.
#   p  toggle pending / idle (the old prefix M-p)
#   r  type a reason
#   d  toggle "done" on this pane; marking it releases the panes waiting on it
#   --
#   1 / 2 / 3 / 4  snooze: pending for that many hours, then idle again on its own
#   s          snooze for a typed number of hours (snooze.sh)
#   --
#   a      auto: pend now, move on, and let an AI read the pane to pick what
#          it waits on (auto_pend.sh)
#   w / W  wait until a picked AI pane goes idle (this session / every session)
#   f / F  wait until a picked AI pane is marked done
#   --
#   e  edit pending reasons in the sequence editor (as prefix C-a)
# Menu commands are format-expanded when an item is picked.
bind -N '菜单：Pending / snooze / 等待其它窗口' -T prefix M-p display-menu -T "#[align=centre] Pending#{?@ai_agent_pending,: #{@ai_agent_pending},}#{?@ai_agent_done, ✓ 已完成,} " -x C -y C \
  "(p) 切换 pending / idle" p "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-p ~/deploy/configs/tmux/script/track_ai_agent_state.sh toggle-pending '#{pane_id}'\"" \
  "(r)eason  写原因" r { command-prompt -p "pending reason" { run-shell 'AI_AGENT_STATE_SOURCE=tmux-menu:M-p-r ~/deploy/configs/tmux/script/track_ai_agent_state.sh pending "#{pane_id}" "%%"' } } \
  "(d)one  标记 / 取消完成" d "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-d ~/deploy/configs/tmux/script/track_ai_agent_state.sh toggle-done '#{pane_id}'\"" \
  "" \
  "(1) 睡 1 小时" 1 "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-1 ~/deploy/configs/tmux/script/snooze.sh '#{pane_id}' 1\"" \
  "(2) 睡 2 小时" 2 "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-2 ~/deploy/configs/tmux/script/snooze.sh '#{pane_id}' 2\"" \
  "(3) 睡 3 小时" 3 "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-3 ~/deploy/configs/tmux/script/snooze.sh '#{pane_id}' 3\"" \
  "(4) 睡 4 小时" 4 "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-4 ~/deploy/configs/tmux/script/snooze.sh '#{pane_id}' 4\"" \
  "(s)nooze  睡几小时" s { command-prompt -p "snooze hours" { run-shell 'AI_AGENT_STATE_SOURCE=tmux-menu:M-p-s ~/deploy/configs/tmux/script/snooze.sh "#{pane_id}" "%%"' } } \
  "" \
  "(a)uto  自动判断在等谁，先切走" a "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-a ~/deploy/configs/tmux/script/auto_pend.sh '#{pane_id}'\"" \
  "(w)ait  等本 session AI 窗口 idle" w "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-w ~/deploy/configs/tmux/script/pend_until.sh idle '#{pane_id}'\"" \
  "(W)ait  等任意 session AI 窗口 idle" W "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-W ~/deploy/configs/tmux/script/pend_until.sh -A idle '#{pane_id}'\"" \
  "(f) 等本 session AI 窗口完成" f "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-f ~/deploy/configs/tmux/script/pend_until.sh done '#{pane_id}'\"" \
  "(F) 等任意 session AI 窗口完成" F "run-shell \"AI_AGENT_STATE_SOURCE=tmux-menu:M-p-F ~/deploy/configs/tmux/script/pend_until.sh -A done '#{pane_id}'\"" \
  "" \
  "(e)dit  在序列编辑器里改  [C-a]" e "run-shell \"$HOME/deploy/configs/tmux/script/open_float_pane.sh --skip-jump-history '#{pane_id}' $HOME/deploy/configs/tmux/auto-switch/sequence.sh edit '#{pane_id}'\""

# prefix + G: use tmuxg to switch within the auto-switch pane sequence
bind -N '在 auto-switch 序列里选 pane' -T prefix G run-shell "$HOME/deploy/configs/tmux/ai/tmuxg.sh --auto-switch-list -q"

# prefix + M-A: switch between saved auto-switch pane sequences.
# With extended-keys on (tmux.conf:18), Alt+Shift+a arrives as M-A (ESC A),
# M-S-a or M-S-A (CSI-u, e.g. VS Code / kitty), so bind all three. A floating pane, not display-popup,
# so Esc reaches fzf (see open_float_pane.sh).
bind -N '切换已保存的 auto-switch 序列' -T prefix M-A run-shell "$HOME/deploy/configs/tmux/script/open_float_pane.sh '#{pane_id}' $HOME/deploy/configs/tmux/auto-switch/sequence.sh select-saved"
bind -N '切换已保存的 auto-switch 序列' -T prefix M-S-a run-shell "$HOME/deploy/configs/tmux/script/open_float_pane.sh '#{pane_id}' $HOME/deploy/configs/tmux/auto-switch/sequence.sh select-saved"
bind -N '切换已保存的 auto-switch 序列' -T prefix M-S-A run-shell "$HOME/deploy/configs/tmux/script/open_float_pane.sh '#{pane_id}' $HOME/deploy/configs/tmux/auto-switch/sequence.sh select-saved"
# tmux unbind -T prefix C-g

# Sync tmux buffer <-> system clipboard.
# - Copy inside tmux: updates both tmux buffer and system clipboard.
# - Paste inside tmux: loads system clipboard into tmux buffer, then pastes.
set-option -g set-clipboard on

# macOS (Terminal.app, iTerm2, etc.)
if-shell 'command -v pbcopy >/dev/null 2>&1' "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell 'command -v pbcopy >/dev/null 2>&1' "bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell 'command -v pbcopy >/dev/null 2>&1' "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell 'command -v pbpaste >/dev/null 2>&1' "bind -T prefix ] run-shell 'pbpaste | tmux load-buffer - && tmux paste-buffer'"

# Linux (prefer xclip, fall back to xsel)
# Wrap xclip/xsel calls with `eval $(tmux show-env -g DISPLAY)` so that
# long-running tmux panes pick up the latest DISPLAY after SSH reconnects.
if-shell 'command -v xclip >/dev/null 2>&1' "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'eval export $(tmux show-env -g DISPLAY 2>/dev/null); xclip -selection clipboard -loops 0 -in'"
if-shell 'command -v xclip >/dev/null 2>&1' "bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'eval export $(tmux show-env -g DISPLAY 2>/dev/null); xclip -selection clipboard -loops 0 -in'"
if-shell 'command -v xclip >/dev/null 2>&1' "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'eval export $(tmux show-env -g DISPLAY 2>/dev/null); xclip -selection clipboard -loops 0 -in'"
if-shell 'command -v xclip >/dev/null 2>&1' "bind -T prefix ] run-shell 'eval export $(tmux show-env -g DISPLAY 2>/dev/null); xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer'"

if-shell 'command -v xsel >/dev/null 2>&1' "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'eval export $(tmux show-env -g DISPLAY 2>/dev/null); xsel --clipboard --input'"
if-shell 'command -v xsel >/dev/null 2>&1' "bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'eval export $(tmux show-env -g DISPLAY 2>/dev/null); xsel --clipboard --input'"
if-shell 'command -v xsel >/dev/null 2>&1' "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'eval export $(tmux show-env -g DISPLAY 2>/dev/null); xsel --clipboard --input'"
if-shell 'command -v xsel >/dev/null 2>&1' "bind -T prefix ] run-shell 'eval export $(tmux show-env -g DISPLAY 2>/dev/null); xsel --clipboard --output | tmux load-buffer - && tmux paste-buffer'"


