set -g mouse on
# Tune copy-mode mouse-wheel scrolling for Termius/mobile terminals. They
# translate touch gestures into discrete wheel events, so keep each copy-mode
# event to a single-line step.
bind -T copy-mode-vi WheelUpPane send-keys -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -N 1 -X scroll-down
bind -T copy-mode-emacs WheelUpPane send-keys -N 1 -X scroll-up
bind -T copy-mode-emacs WheelDownPane send-keys -N 1 -X scroll-down

